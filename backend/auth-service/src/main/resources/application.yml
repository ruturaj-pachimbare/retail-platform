server:
  port: 8085
spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=auth_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:RetailDev_Passw0rd!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
app:
  security:
    issuer: ${AUTH_ISSUER:http://localhost:8085}
    postman-client-id: ${POSTMAN_CLIENT_ID:retail-postman}
    postman-client-secret: ${POSTMAN_CLIENT_SECRET:PostmanDevSecret_ChangeMe}
management:
  endpoints:
    web:
      exposure:
        include: health,info
