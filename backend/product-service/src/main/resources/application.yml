server:
  port: 8081

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=product_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:RetailDev_Passw0rd!}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing local DBs were created by Hibernate before Flyway was added.
    # Baseline them at V1; new empty databases execute V1 normally.
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: Product Service
    description: Retail Platform product catalogue
    version: 0.0.1
