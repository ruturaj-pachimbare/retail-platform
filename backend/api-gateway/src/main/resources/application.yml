server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
  # Config Server is optional at startup because this module also contains
  # working local defaults below. Set CONFIG_SERVER_URL if it runs elsewhere.
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Location
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory,/api/v1/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders,/api/v1/orders/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications,/api/v1/notifications/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    gateway:
      access: read-only

info:
  app:
    name: Retail Platform API Gateway
    description: Single entry point for Retail Platform microservices
    version: 0.0.1-SNAPSHOT

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: WARN
