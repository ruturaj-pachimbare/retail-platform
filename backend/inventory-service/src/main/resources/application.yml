server:
  port: 8082

spring:
  application:
    name: inventory-service
  config:
    import: "configserver:http://localhost:8888"
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=inventory_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:RetailDev_Passw0rd!}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: Inventory Service
    description: Retail Platform stock management
    version: 0.0.1
