server:
  port: 8083
spring:
  application:
    name: order-service
  config:
    import: "configserver:http://localhost:8888"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=order_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:RetailDev_Passw0rd!}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    reserve-path: /api/v1/inventory/{productId}/reservations
    release-path: /api/v1/inventory/{productId}/release
app:
  kafka:
    order-events-topic: retail.order.events
  outbox:
    publish-delay-ms: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
