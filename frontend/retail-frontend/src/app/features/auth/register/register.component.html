<div class="auth-page"><form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
<h1>Create account</h1><p>Join TechZone Retail.</p>
<label>Username</label><input formControlName="username" autocomplete="username">
<small *ngIf="form.controls.username.touched && form.controls.username.invalid">Enter at least 3 characters.</small>
<label>Email</label><input type="email" formControlName="email" autocomplete="email">
<small *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email.</small>
<label>Password</label><input type="password" formControlName="password" autocomplete="new-password">
<small *ngIf="form.controls.password.touched && form.controls.password.invalid">Password must be at least 8 characters.</small>
<p class="error" *ngIf="error">{{ error }}</p><p class="success" *ngIf="success">{{ success }}</p>
<button type="submit" [disabled]="loading">{{ loading ? 'Creating...' : 'Create account' }}</button>
<p class="foot">Already registered? <a routerLink="/login">Sign in</a></p>
</form></div>
