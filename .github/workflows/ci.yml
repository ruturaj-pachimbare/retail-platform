
name: Retail Platform CI

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Build Spring Boot - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - config-server
          - discovery-server
          - product-service
          - inventory-service
          - order-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test service
        working-directory: backend/${{ matrix.service }}
        run: mvn -B clean verify

  auth-service-test:
    name: Build and test Auth Service
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: RetailCI_Passw0rd!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'RetailCI_Passw0rd!2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      DB_URL: jdbc:sqlserver://localhost:1433;databaseName=auth_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: RetailCI_Passw0rd!2026

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create Auth database
        run: |
          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa \
            -P "$DB_PASSWORD" \
            -Q "IF DB_ID('auth_db') IS NULL CREATE DATABASE auth_db"

      - name: Build and test Auth Service
        working-directory: backend/auth-service
        run: mvn -B clean verify

  notification-service-test:
    name: Build and test Notification Service
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: RetailCI_Passw0rd!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'RetailCI_Passw0rd!2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      DB_URL: jdbc:sqlserver://localhost:1433;databaseName=notification_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: RetailCI_Passw0rd!2026
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: 'false'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create Notification database
        run: |
          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa \
            -P "$DB_PASSWORD" \
            -Q "IF DB_ID('notification_db') IS NULL CREATE DATABASE notification_db"

      - name: Build and test Notification Service
        working-directory: backend/notification-service
        run: mvn -B clean verify

  frontend-build:
    name: Build Angular frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/retail-frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/retail-frontend
        run: npm ci

      - name: Build Angular application
        working-directory: frontend/retail-frontend
        run: npm run build -- --configuration production
