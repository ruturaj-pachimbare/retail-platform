
name: Retail Platform CI

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Build Spring Boot - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - config-server
          - discovery-server
          - product-service
          - inventory-service
          - order-service
          - notification-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test service
        working-directory: backend/${{ matrix.service }}
        run: mvn -B clean verify

  frontend-build:
    name: Build Angular frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/retail-frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/retail-frontend
        run: npm ci

      - name: Build Angular application
        working-directory: frontend/retail-frontend
        run: npm run build -- --configuration production
