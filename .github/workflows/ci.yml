
name: Retail Platform CI-CD

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # 1. BACKEND BUILD AND TEST
  # ==========================================
  backend-build:
    name: Backend - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - config-server
          - discovery-server
          - product-service
          - inventory-service
          - order-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test service
        working-directory: backend/${{ matrix.service }}
        run: mvn -B clean verify


  # ==========================================
  # 2. AUTH SERVICE BUILD AND TEST
  # ==========================================
  auth-service-test:
    name: Auth Service - Build and Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: RetailCI_Passw0rd!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'RetailCI_Passw0rd!2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      DB_URL: jdbc:sqlserver://localhost:1433;databaseName=auth_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: RetailCI_Passw0rd!2026

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create Auth database
        run: |
          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa \
            -P "$DB_PASSWORD" \
            -Q "IF DB_ID('auth_db') IS NULL CREATE DATABASE auth_db"

      - name: Build and test Auth Service
        working-directory: backend/auth-service
        run: mvn -B clean verify


  # ==========================================
  # 3. NOTIFICATION SERVICE BUILD AND TEST
  # ==========================================
  notification-service-test:
    name: Notification Service - Build and Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: RetailCI_Passw0rd!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'RetailCI_Passw0rd!2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      DB_URL: jdbc:sqlserver://localhost:1433;databaseName=notification_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: RetailCI_Passw0rd!2026
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: 'false'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create Notification database
        run: |
          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa \
            -P "$DB_PASSWORD" \
            -Q "IF DB_ID('notification_db') IS NULL CREATE DATABASE notification_db"

      - name: Build and test Notification Service
        working-directory: backend/notification-service
        run: mvn -B clean verify


  # ==========================================
  # 4. ANGULAR FRONTEND BUILD
  # ==========================================
  frontend-build:
    name: Angular Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/retail-frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/retail-frontend
        run: npm ci

      - name: Build Angular application
        working-directory: frontend/retail-frontend
        run: npm run build -- --configuration production


  # ==========================================
  # 5. DOCKER BUILD AND PUSH TO GHCR
  # ==========================================
  docker-publish:
    name: Docker - ${{ matrix.image }}
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - auth-service-test
      - notification-service-test
      - frontend-build

    # Do not publish images for pull requests.
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: backend/api-gateway

          - image: auth-service
            context: backend/auth-service

          - image: config-server
            context: backend/config-server

          - image: discovery-server
            context: backend/discovery-server

          - image: product-service
            context: backend/product-service

          - image: inventory-service
            context: backend/inventory-service

          - image: order-service
            context: backend/order-service

          - image: notification-service
            context: backend/notification-service

          - image: frontend
            context: frontend/retail-frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/retail-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/retail-${{ matrix.image }}:latest
